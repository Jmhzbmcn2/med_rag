<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediRAG - Medical AI Assistant</title>
  <style>
    :root{
      --bg:#f5f8fb;
      --panel:#ffffff;
      --border:#e4eaf0;
      --text:#1f2937;
      --muted:#6b7280;
      --primary:#1477e6;
      --primary-soft:#eaf4ff;
      --success:#16a34a;
      --warning:#b45309;
      --shadow:0 8px 24px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:var(--bg);
      height:100vh;
      overflow:hidden;
    }
    .app{
      height:100vh;
      display:grid;
      grid-template-rows:64px 1fr 38px;
    }
    header{
      background:rgba(255,255,255,.95);
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
      backdrop-filter:blur(10px);
    }
    .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px}
    .brand-badge{
      width:36px;height:36px;border-radius:12px;background:var(--primary);
      display:grid;place-items:center;color:#fff;font-size:20px;
      box-shadow:0 6px 16px rgba(20,119,230,.25)
    }
    .status{
      display:flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      color:#166534;background:#effcf3;border:1px solid #ccefd7;
      font-size:13px;font-weight:700;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
    .layout{
      min-height:0;
      display:grid;
      grid-template-columns:240px minmax(420px,1fr) 300px;
    }
    aside,.sources{
      background:var(--panel);
      min-height:0;
      overflow:auto;
    }
    aside{border-right:1px solid var(--border);padding:16px}
    .sources{border-left:1px solid var(--border);padding:16px}
    .new-chat{
      width:100%;border:0;border-radius:12px;padding:11px 14px;
      background:var(--primary);color:#fff;font-weight:800;cursor:pointer;
      box-shadow:0 6px 16px rgba(20,119,230,.18)
    }
    .section-title{
      margin:20px 4px 8px;font-size:11px;letter-spacing:.08em;
      text-transform:uppercase;color:#9ca3af;font-weight:800;
    }
    .chat-item{
      padding:11px 12px;border-radius:10px;margin-bottom:5px;
      font-size:14px;cursor:pointer;color:#374151;
    }
    .chat-item.active{background:var(--primary-soft);color:#0f5db6;font-weight:700}
    .main{
      min-width:0;min-height:0;
      display:grid;grid-template-rows:auto 1fr auto;
      background:linear-gradient(180deg,#f9fbfd 0%,#f4f7fa 100%);
    }
    .main-head{
      padding:18px 24px;border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.78);
    }
    .main-head h1{font-size:18px;margin:0 0 4px}
    .main-head p{font-size:13px;color:var(--muted);margin:0}
    .messages{
      overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;
    }
    .row{display:flex;gap:10px;align-items:flex-start}
    .row.user{justify-content:flex-end}
    .avatar{
      width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
      background:#e9eef5;flex:0 0 auto;
    }
    .assistant .avatar{background:#eaf4ff;color:#0f5db6}
    .bubble{
      max-width:72%;padding:13px 15px;border-radius:16px;
      line-height:1.55;font-size:14px;box-shadow:var(--shadow);
    }
    .user .bubble{
      background:var(--primary);color:white;border-bottom-right-radius:5px;
    }
    .assistant .bubble{
      background:white;border:1px solid var(--border);border-bottom-left-radius:5px;
    }
    .citation{
      display:inline-flex;align-items:center;justify-content:center;
      height:20px;min-width:20px;padding:0 6px;margin-left:3px;
      border-radius:7px;background:var(--primary-soft);color:#0f5db6;
      font-size:11px;font-weight:800;vertical-align:1px;
    }
    .composer{
      padding:14px 20px 18px;border-top:1px solid var(--border);
      background:rgba(255,255,255,.88);
    }
    .input-wrap{
      display:flex;align-items:center;gap:10px;background:white;
      border:1px solid #d9e2ec;border-radius:14px;padding:8px 8px 8px 14px;
      box-shadow:var(--shadow);
    }
    input{
      flex:1;border:0;outline:none;font-size:14px;background:transparent;
    }
    .send{
      width:38px;height:38px;border:0;border-radius:10px;
      background:var(--primary);color:white;font-size:18px;cursor:pointer;
    }
    .sources h2{font-size:16px;margin:2px 0 14px}
    .source-card{
      border:1px solid var(--border);border-radius:14px;padding:14px;
      margin-bottom:12px;background:#fff;box-shadow:var(--shadow);
    }
    .source-top{display:flex;gap:10px;align-items:flex-start}
    .doc-icon{
      width:34px;height:34px;border-radius:9px;background:#f1f5f9;
      display:grid;place-items:center;flex:0 0 auto;
    }
    .source-card h3{font-size:13px;margin:0 0 4px}
    .meta{font-size:12px;color:var(--muted)}
    .score{
      margin-top:12px;padding-top:10px;border-top:1px solid #eef2f7;
      display:flex;justify-content:space-between;font-size:12px
    }
    .score strong{color:#0f5db6}
    .passage{
      margin-top:9px;font-size:12px;color:#4b5563;line-height:1.5;
      background:#f8fafc;padding:9px;border-radius:9px;
    }
    footer{
      display:flex;align-items:center;justify-content:center;
      border-top:1px solid var(--border);background:#fff8e8;
      color:var(--warning);font-size:12px;font-weight:700;
    }
    .bubble{white-space:pre-wrap;overflow-wrap:anywhere}
    .bubble.pending{color:var(--muted)}
    .bubble.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}
    .send:disabled{opacity:.5;cursor:default}
    .badge{
      display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;
      background:#f1f5f9;color:#475569;font-size:11px;font-weight:700;
    }
    .source-card h3 a{color:inherit;text-decoration:none}
    .source-card h3 a:hover{text-decoration:underline}
    .status.offline{color:#991b1b;background:#fef2f2;border-color:#fecaca}
    .status.offline .dot{background:#dc2626}
    .empty{font-size:13px;color:var(--muted)}
    @media (max-width:980px){
      .layout{grid-template-columns:200px 1fr}
      .sources{display:none}
    }
    @media (max-width:700px){
      .layout{grid-template-columns:1fr}
      aside{display:none}
      .bubble{max-width:88%}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-badge">✚</div>
        <span>MediRAG</span>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
    </header>

    <div class="layout">
      <aside>
        <button class="new-chat" id="new-chat">＋ New Chat</button>
        <div class="section-title">Today</div>
        <div class="chat-item active">COPD symptoms</div>
        <div class="chat-item">Diabetes treatment</div>
        <div class="chat-item">Blood test results</div>

        <div class="section-title">Previous</div>
        <div class="chat-item">Hypertension</div>
        <div class="chat-item">Medication interaction</div>
      </aside>

      <main class="main">
        <div class="main-head">
          <h1>Medical AI Assistant</h1>
          <p>Ask questions grounded in your medical knowledge base.</p>
        </div>

        <div class="messages" id="messages"></div>

        <div class="composer">
          <div class="input-wrap">
            <input id="question" placeholder="Ask a medical question..." />
            <button class="send" id="send">➤</button>
          </div>
        </div>
      </main>

      <section class="sources">
        <h2>Sources</h2>
        <div id="sources"></div>
      </section>
    </div>

    <footer>⚠️ AI-generated information — not a medical diagnosis.</footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const messages = $('messages'), sourcesEl = $('sources'), input = $('question'), sendBtn = $('send');
    const EMPTY_SOURCES = 'Sources appear here after you ask a question.';

    function el(tag, className, text){
      const node = document.createElement(tag);
      if(className) node.className = className;
      if(text !== undefined) node.textContent = text;
      return node;
    }

    function addRow(role, avatar){
      const row = el('div', 'row ' + role);
      const bubble = el('div', 'bubble');
      const face = el('div', 'avatar', avatar);
      if(role === 'user') row.append(bubble, face); else row.append(face, bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    // Text nodes and citation chips only, never innerHTML, so model output cannot inject markup.
    function renderAnswer(bubble, text, count){
      bubble.textContent = '';
      text.split(/(\[\d+\])/).forEach(part => {
        const m = part.match(/^\[(\d+)\]$/);
        if(m && +m[1] >= 1 && +m[1] <= count) bubble.appendChild(el('span', 'citation', m[1]));
        else if(part) bubble.appendChild(document.createTextNode(part));
      });
    }

    function renderSources(sources){
      sourcesEl.textContent = '';
      if(!sources.length){
        sourcesEl.appendChild(el('div', 'empty', EMPTY_SOURCES));
        return;
      }
      sources.forEach(s => {
        const card = el('div', 'source-card');
        const top = el('div', 'source-top');
        const info = el('div');
        const title = el('h3');
        const label = `[${s.n}] ${s.title}`;
        if(/^https?:\/\//.test(s.url)){
          const link = el('a', '', label);
          link.href = s.url;
          link.target = '_blank';
          link.rel = 'noopener';
          title.appendChild(link);
        } else {
          title.textContent = label;
        }
        info.append(title, el('div', 'meta', s.section_path), el('span', 'badge', s.type));
        top.append(el('div', 'doc-icon', '📄'), info);
        card.appendChild(top);
        if(s.score !== null){
          const score = el('div', 'score');
          score.append(el('span', '', 'Reranker score'), el('strong', '', s.score.toFixed(2)));
          card.appendChild(score);
        }
        const body = s.text.replace(/^\[[^\]]*\]\s*/, '');  // drop the "[Chủ đề: … | Nguồn: …]" header
        card.appendChild(el('div', 'passage', body.length > 300 ? body.slice(0, 300) + '…' : body));
        sourcesEl.appendChild(card);
      });
    }

    async function sendMessage(){
      const question = input.value.trim();
      if(!question || sendBtn.disabled) return;
      addRow('user', '👤').textContent = question;
      input.value = '';
      sendBtn.disabled = true;
      const bubble = addRow('assistant', '🩺');
      bubble.classList.add('pending');
      bubble.textContent = 'Thinking…';
      try{
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question}),
        });
        const data = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : `Request failed (${res.status})`);
        bubble.classList.remove('pending');
        renderAnswer(bubble, data.answer, data.sources.length);
        renderSources(data.sources);
      }catch(err){
        bubble.classList.remove('pending');
        bubble.classList.add('error');
        bubble.textContent = err.message;
      }finally{
        sendBtn.disabled = false;
        messages.scrollTop = messages.scrollHeight;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.isComposing) sendMessage();  // isComposing: Vietnamese IMEs confirm text with Enter
    });
    $('new-chat').addEventListener('click', () => {
      messages.textContent = '';
      renderSources([]);
    });

    renderSources([]);
    fetch('/api/health')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(h => { $('status-text').textContent = `Knowledge base ready · ${h.points} chunks`; })
      .catch(() => {
        $('status').classList.add('offline');
        $('status-text').textContent = 'Offline';
      });
  </script>
</body>
</html>
