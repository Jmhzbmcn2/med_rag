[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-text-splitters",
    "transformers",
    "pandas",
    "qdrant-client>=1.10",
    "pyvi",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["medical_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
